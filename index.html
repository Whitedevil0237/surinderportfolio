*{box-sizing:border-box;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{background:var(--bg);color:var(--ink);font:400 1.05rem/1.65 "IBM Plex Sans",system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:"Bricolage Grotesque","Arial Narrow",sans-serif;line-height:1.05;letter-spacing:-.025em}
a{color:inherit}
:focus-visible{outline:3px solid var(--c);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}

/* animated backdrop so the glass has something to blur */
.orbs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.orbs i{position:absolute;border-radius:50%;filter:blur(90px);will-change:transform}
.orbs i:nth-child(1){width:520px;height:520px;background:var(--o1);top:-120px;left:-100px;animation:f1 18s ease-in-out infinite alternate}
.orbs i:nth-child(2){width:460px;height:460px;background:var(--o2);top:30%;right:-120px;animation:f2 22s ease-in-out infinite alternate}
.orbs i:nth-child(3){width:420px;height:420px;background:var(--o3);bottom:-120px;left:25%;animation:f3 20s ease-in-out infinite alternate}
@keyframes f1{to{transform:translate(160px,120px) scale(1.15)}}
@keyframes f2{to{transform:translate(-180px,-80px) scale(1.2)}}
@keyframes f3{to{transform:translate(120px,-140px) scale(1.1)}}
.grain{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--edge) 1px,transparent 1px),linear-gradient(90deg,var(--edge) 1px,transparent 1px);
